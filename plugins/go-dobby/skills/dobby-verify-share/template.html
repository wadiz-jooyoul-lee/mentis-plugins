<title>__KEY__ 검증 결과</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 대시보드 검증 탭과 같은 한 줄 흐름 — 설계된 테스트 접이칸, 환경별 현황표, 환경 탭(판정 카드·닫히는 조건·회차·확인한 항목) */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --soft: #fafafa; --line: #f0f0f0; --line-strong: #d9d9d9;
  --fg: rgba(0,0,0,.88); --muted: rgba(0,0,0,.5); --accent: #1677ff;
  --pass: #52c41a; --fail: #ff4d4f; --skip: #8c8c8c; --purple: #722ed1;
  --pass-bg: #f6ffed; --pass-bd: #b7eb8f; --fail-bg: #fff2f0; --fail-bd: #ffccc7; --ok-card: #fafffa;
  --code-bg: rgba(0,0,0,.05);
  --font: -apple-system, "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --surface: #171a20; --soft: #1e2229; --line: #262b33; --line-strong: #3a414c;
  --fg: rgba(255,255,255,.88); --muted: rgba(255,255,255,.5); --accent: #4c8dff;
  --pass: #6bd13a; --fail: #ff6b6b; --skip: #9aa0a8; --purple: #b37feb;
  --pass-bg: #17251a; --pass-bd: #2f5a24; --fail-bg: #2a1718; --fail-bd: #5c2b2b; --ok-card: #161f18;
  --code-bg: rgba(255,255,255,.08); color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --soft: #1e2229; --line: #262b33; --line-strong: #3a414c;
  --fg: rgba(255,255,255,.88); --muted: rgba(255,255,255,.5); --accent: #4c8dff;
  --pass: #6bd13a; --fail: #ff6b6b; --skip: #9aa0a8; --purple: #b37feb;
  --pass-bg: #17251a; --pass-bd: #2f5a24; --fail-bg: #2a1718; --fail-bd: #5c2b2b; --ok-card: #161f18;
  --code-bg: rgba(255,255,255,.08); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
h1 { font-size: 22px; margin: 0; text-wrap: balance; }
h2 { font-size: 18px; margin: 0 0 12px; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.head .key { font-family: var(--mono); color: var(--accent); font-size: 13px; }
.head .key a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
.head .key a:hover { opacity: .75; }
.head p { margin: 6px 0 0; max-width: 70ch; }
code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
/* 태그 */
.tag { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 7px; border: 1px solid var(--line-strong); border-radius: 4px; white-space: nowrap; }
.tag.pass { color: var(--pass); border-color: var(--pass); }
.tag.fail { color: var(--fail); border-color: var(--fail); }
.tag.skip { color: var(--skip); border-color: var(--skip); }
.tag.blue { color: var(--accent); border-color: var(--accent); font-weight: 600; min-width: 40px; text-align: center; }
.tag.purple { color: var(--purple); border-color: var(--purple); }
/* 접이칸 */
details.col { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; }
details.col > summary { cursor: pointer; list-style: none; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details.col > summary::-webkit-details-marker { display: none; }
details.col > summary::before { content: "›"; display: inline-block; width: 12px; transition: transform .15s; color: var(--muted); }
details.col[open] > summary::before { transform: rotate(90deg); }
details.col > summary .grow { flex: 1; min-width: 0; }
details.col > .body { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
details.col.sm { border-radius: 6px; }
details.col.sm > summary { padding: 8px 12px; }
details.col.sm > .body { padding: 8px 12px 12px; }
.sc-list { display: flex; flex-direction: column; gap: 0; }
.sc-list > details.col { border-radius: 0; border-top-width: 0; }
.sc-list > details.col:first-child { border-top-width: 1px; border-radius: 6px 6px 0 0; }
.sc-list > details.col:last-child { border-radius: 0 0 6px 6px; }
.sc-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.plan-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.plan-tools input { flex: 1; min-width: 180px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
button { font: inherit; cursor: pointer; }
.btn { padding: 5px 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); border-radius: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 마크다운 */
.md { font-size: 14px; line-height: 1.65; min-width: 0; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 6px 0; }
.md ul, .md ol { padding-left: 20px; }
.md pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
.md pre code { background: none; padding: 0; overflow-wrap: normal; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line-strong); padding: 4px 8px; vertical-align: top; }
.md th { background: var(--soft); }
.md h3, .md h4 { font-size: 14px; margin: 14px 0 4px; }
.tp-rows { margin: 0; }
.tp-row { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tp-row:last-child { border-bottom: none; }
.tp-row dt { font-weight: 600; color: var(--muted); font-size: 13px; padding-top: 2px; }
.tp-row dd { margin: 0; min-width: 0; }
.tp-box { border-radius: 8px; padding: 10px 14px; border: 1px solid; }
.tp-box-title { font-weight: 600; font-size: 13px; }
.tp-pass { background: var(--pass-bg); border-color: var(--pass-bd); }
.tp-fail { background: var(--fail-bg); border-color: var(--fail-bd); }
.tp-dev { font-size: 13px; color: var(--muted); }
.tp-dev summary { cursor: pointer; }
.tp-section-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
/* 표 */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; background: var(--soft); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: none; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--soft); }
table.t tr.active td { background: var(--soft); }
table.t tr.note td { background: var(--soft); color: var(--muted); font-size: 13px; }
.exp { border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); width: 18px; height: 18px; line-height: 14px; padding: 0; border-radius: 3px; font-size: 12px; }
/* 탭 */
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line-strong); overflow-x: auto; }
.tabs button { background: none; border: none; padding: 10px 0; color: var(--fg); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.panel { display: flex; flex-direction: column; gap: 24px; padding-top: 16px; }
/* 판정 카드 */
.verdict { background: var(--ok-card); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; }
.verdict.bad { background: var(--fail-bg); border-color: var(--fail-bd); }
.verdict .line { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.verdict .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; background: var(--soft); border-radius: 8px; text-align: center; }
.stat b { display: block; font-size: 26px; line-height: 1.2; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 16px; }
/* 닫히는 조건 */
.cond { display: grid; grid-template-columns: auto minmax(0,1fr) auto 52px; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.cond .its { font-size: 12px; color: var(--muted); text-align: right; }
.cond .v { font-size: 12px; text-align: right; }
@media (max-width: 640px) {
  .tp-row { grid-template-columns: 1fr; gap: 2px; }
  .cond { grid-template-columns: auto minmax(0,1fr) 52px; }
  .cond .its { grid-column: 2 / 4; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header class="head">
    <div class="key">__KEYLINK__</div>
    <h1>__TITLE__</h1>
    <p class="muted">설계된 테스트 케이스와 __ENVS__ 환경의 검증 결과를 모았습니다. 환경마다 여러 번 돌린 시험을 합쳐 항목별 최종 판정 하나로 보여 줍니다.</p>
  </header>

  <section id="plan"></section>
  <section id="envs"></section>
  <section id="tabs-wrap"></section>
</div>

<script>__MARKED__</script>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const LABEL = { pass: "통과", fail: "실패", skip: "보류", warn: "주의", unknown: "-" };
  const toneVar = (v) => v === "pass" ? "var(--pass)" : v === "fail" ? "var(--fail)" : "var(--skip)";
  const toneCls = (v) => v === "pass" ? "pass" : v === "fail" ? "fail" : "skip";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = (s) => {
    try { return '<div class="md">' + (window.marked ? marked.parse(s || "", { gfm: true }) : "<pre>" + esc(s) + "</pre>") + "</div>"; }
    catch (e) { return '<div class="md"><pre>' + esc(s) + "</pre></div>"; }
  };
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  /* ── 설계된 테스트 케이스 ── */
  const PASS_L = new Set(["통과 기준", "기대", "기대 결과", "판정 기준"]);
  const FAIL_L = new Set(["실패로 보는 것"]);
  const DEV_L = new Set(["진입 근거", "관련 파일"]);
  const rows = (fields) => fields.length ? '<dl class="tp-rows">' + fields.map((f) =>
    '<div class="tp-row"><dt>' + esc(f.label) + "</dt><dd>" + (f.body ? md(f.body) : '<span class="muted">—</span>') + "</dd></div>").join("") + "</dl>" : "";
  function scenarioBody(s) {
    const main = s.fields.filter((f) => !PASS_L.has(f.label) && !FAIL_L.has(f.label) && !DEV_L.has(f.label));
    const pass = s.fields.filter((f) => PASS_L.has(f.label));
    const fail = s.fields.filter((f) => FAIL_L.has(f.label));
    const dev = s.fields.filter((f) => DEV_L.has(f.label));
    return rows(main)
      + pass.map((f) => '<div class="tp-box tp-pass"><div class="tp-box-title">✅ ' + esc(f.label) + "</div>" + md(f.body) + "</div>").join("")
      + fail.map((f) => '<div class="tp-box tp-fail"><div class="tp-box-title">❌ ' + esc(f.label) + "</div>" + md(f.body) + "</div>").join("")
      + (s.extra ? md(s.extra) : "")
      + (dev.length ? '<details class="tp-dev"><summary>개발자 참고 (' + esc(dev.map((f) => f.label).join(", ")) + ")</summary>" + rows(dev) + "</details>" : "");
  }
  const P = D.plan;
  const plan = el('<details class="col"><summary><span class="grow"><b>설계된 테스트 케이스</b></span><span class="muted">시나리오 ' + P.scenarios.length + '개</span></summary><div class="body"></div></details>');
  const pbody = plan.querySelector(".body");
  const prep = el('<details class="col sm"><summary><b class="grow">' + esc(P.sections.map((s) => s.title).join(" · ")) + '</b></summary><div class="body"></div></details>');
  prep.addEventListener("toggle", function once() {
    if (!prep.open || prep.dataset.done) return; prep.dataset.done = "1";
    prep.querySelector(".body").innerHTML = P.sections.map((s) => '<div class="tp-section"><div class="tp-section-title">' + esc(s.title) + "</div>" + md(s.body) + "</div>").join("");
  });
  pbody.appendChild(prep);
  const tools = el('<div class="plan-tools"><input id="sc-filter" type="search" placeholder="시나리오 번호나 제목, 조건(C1)으로 찾기"><button class="btn" id="sc-open">모두 펼치기</button><button class="btn" id="sc-close">모두 접기</button></div>');
  pbody.appendChild(tools);
  const list = el('<div class="sc-list"></div>');
  P.scenarios.forEach((s) => {
    const d = el('<details class="col sm" data-q="' + esc((s.id + " " + s.title + " " + s.conds.join(" ")).toLowerCase()) + '"><summary><span class="tag blue">' + esc(s.id) + '</span><span class="grow">' + esc(s.title) + '</span><span class="sc-tags">'
      + s.conds.map((c) => '<span class="tag purple">' + esc(c) + "</span>").join("") + s.bundles.map((b) => '<span class="tag">' + esc(b) + "</span>").join("")
      + '</span></summary><div class="body"></div></details>');
    d.addEventListener("toggle", () => { if (d.open && !d.dataset.done) { d.dataset.done = "1"; d.querySelector(".body").innerHTML = scenarioBody(s); } });
    list.appendChild(d);
  });
  pbody.appendChild(list);
  document.getElementById("plan").appendChild(plan);
  tools.querySelector("#sc-filter").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    list.querySelectorAll(":scope > details").forEach((d) => { d.hidden = q && !d.dataset.q.includes(q); });
  });
  tools.querySelector("#sc-open").addEventListener("click", () => list.querySelectorAll(":scope > details:not([hidden])").forEach((d) => d.open = true));
  tools.querySelector("#sc-close").addEventListener("click", () => list.querySelectorAll(":scope > details").forEach((d) => d.open = false));

  /* ── 환경별 현황 ── */
  const envs = D.envs;
  let active = (envs.find((e) => e.env === "rc4") || envs[0]).env;
  const metOf = (e) => e.conditions.filter((c) => c.verdict === "pass").length;
  const envBox = document.getElementById("envs");
  function renderEnvTable() {
    envBox.innerHTML = '<h2>환경별 현황</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>환경</th><th>확인 항목</th><th>통과</th><th>실패</th><th>보류</th><th>닫히는 조건</th></tr></thead><tbody>'
      + envs.map((e) => '<tr class="click' + (e.env === active ? " active" : "") + '" data-env="' + esc(e.env) + '" tabindex="0"><td>' + esc(e.env) + '</td><td>' + e.items.length + '가지</td><td style="color:var(--pass)">' + e.pass + '</td><td' + (e.fail > 0 ? ' style="color:var(--fail)"' : "") + ">" + e.fail + "</td><td>" + e.skip + "</td><td>" + e.conditions.length + "가지 중 " + metOf(e) + "가지</td></tr>").join("")
      + "</tbody></table></div>";
    envBox.querySelectorAll("tr.click").forEach((tr) => {
      const go = () => { active = tr.dataset.env; render(); };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
    });
  }

  /* ── 환경 탭 ── */
  const wrap = document.getElementById("tabs-wrap");
  function panel(e) {
    const met = metOf(e);
    const bad = e.fail > 0;
    const bar = [[e.pass, "var(--pass)"], [e.fail, "var(--fail)"], [e.skip, "var(--skip)"]].filter((x) => x[0] > 0)
      .map((x) => '<div style="flex:' + x[0] + ";background:" + x[1] + '"></div>').join("");
    const stat = (n, l, c) => '<div class="stat"><b' + (c ? ' style="color:' + c + '"' : "") + ">" + n + '</b><span class="muted small">' + l + "</span></div>";
    const verdict = '<div class="verdict' + (bad ? " bad" : "") + '"><div class="line"><span class="big" style="color:' + (bad ? "var(--fail)" : "var(--pass)") + '">' + (bad ? "실패 " + e.fail + "건" : "테스트 완료") + '</span><span class="muted">' + esc(e.env) + " 환경에서 " + e.items.length + "가지를 확인했습니다</span></div>"
      + '<div class="stats">' + stat(e.pass, "통과", "var(--pass)") + stat(e.fail, "실패", bad ? "var(--fail)" : "") + stat(e.skip, "보류") + '</div><div class="bar">' + bar + "</div></div>";
    const conds = "<div><h2>닫히는 조건 <span class=\"small\" style=\"font-size:14px;font-weight:400;" + (met === e.conditions.length ? "color:var(--pass)" : "") + '">' + e.conditions.length + "가지 중 " + met + "가지 확인</span></h2>"
      + (D.closing ? "<div>" + esc(D.closing) + "</div>" : "")
      + '<div style="margin-top:12px">' + e.conditions.map((c) => {
        const none = c.items.length === 0;
        return '<div class="cond"><span class="tag' + (none ? "" : " " + toneCls(c.verdict)) + '" style="min-width:40px;text-align:center">' + esc(c.id) + "</span><span>" + esc(c.text) + '</span><span class="its">' + (none ? "확인한 시나리오 없음" : esc(c.items.join("·"))) + '</span><span class="v" style="color:' + (none ? "var(--muted)" : toneVar(c.verdict)) + '">' + (none ? "미확인" : LABEL[c.verdict]) + "</span></div>";
      }).join("") + "</div></div>";
    const items = "<div><h2>확인한 항목 " + e.items.length + '가지</h2><div class="tbl-wrap"><table class="t items"><thead><tr><th></th><th>#</th><th>확인 항목</th><th>최종 판정</th></tr></thead><tbody>'
      + e.items.map((it, i) => "<tr><td>" + (it.note ? '<button class="exp" data-i="' + i + '" aria-label="근거 펼치기">+</button>' : "") + '</td><td style="white-space:nowrap">' + esc(it.num) + "</td><td>" + esc(it.name) + "</td><td>"
        + '<span class="tag ' + toneCls(it.verdict) + '">' + LABEL[it.verdict] + "</span></td></tr>").join("")
      + "</tbody></table></div></div>";
    const p = el('<div class="panel">' + verdict + conds + items + "</div>");
    p.querySelectorAll("button.exp").forEach((b) => b.addEventListener("click", () => {
      const tr = b.closest("tr");
      if (tr.nextElementSibling && tr.nextElementSibling.classList.contains("note")) { tr.nextElementSibling.remove(); b.textContent = "+"; return; }
      const n = el('<table><tbody><tr class="note"><td></td><td colspan="3">' + esc(e.items[+b.dataset.i].note) + "</td></tr></tbody></table>").querySelector("tr");
      tr.after(n); b.textContent = "−";
    }));
    return p;
  }
  function renderTabs() {
    wrap.innerHTML = "";
    const tabs = el('<div class="tabs" role="tablist"></div>');
    envs.forEach((e) => {
      const b = el('<button role="tab" aria-selected="' + (e.env === active) + '">' + esc(e.env) + "</button>");
      b.addEventListener("click", () => { active = e.env; render(); });
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);
    wrap.appendChild(panel(envs.find((e) => e.env === active)));
  }
  function render() { renderEnvTable(); renderTabs(); }
  render();
})();
</script>
